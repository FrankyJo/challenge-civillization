name: quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint · typecheck · unit · build · integration · smoke · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: civilization
          POSTGRES_PASSWORD: civilization
          POSTGRES_DB: civilization_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civilization"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://civilization:civilization@127.0.0.1:5432/civilization_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @civ/web exec playwright install --with-deps chromium
      - run: pnpm gates
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container image smoke (compose apps profile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --detach --wait postgres redis
      - run: bash scripts/container-smoke.sh
